name: Update Crypto Prices

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Fetch BTC and ETH Prices
      run: |
        # Fetching from Coinbase API to avoid GitHub Action IP blocks
        btc_price=$(curl -s "https://api.coinbase.com/v2/prices/BTC-USD/spot" | jq -r '.data.amount // "N/A"')
        eth_price=$(curl -s "https://api.coinbase.com/v2/prices/ETH-USD/spot" | jq -r '.data.amount // "N/A"')
        
        # Write data to file
        echo "=== Crypto Prices ===" > crypto_prices.txt
        echo "Last Updated: $(date -u) UTC" >> crypto_prices.txt
        echo "Bitcoin (BTC): \$${btc_price} USD" >> crypto_prices.txt
        echo "Ethereum (ETH): \$${eth_price} USD" >> crypto_prices.txt

    - name: Commit and Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add crypto_prices.txt
        git commit -m "chore: update crypto prices" || echo "No changes to commit"
        git push
